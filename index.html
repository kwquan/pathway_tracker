<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Trivium — Progress Tracker</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trivium">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" href="icons/icon-192.png?v=2">
<meta name="theme-color" content="#0b0e14">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <!-- HOME VIEW -->
  <div id="view-home">
    <div class="home-header">
      <div class="eyebrow">progress tracker</div>
      <h1>Pathways</h1>
      <p class="sub">Data Science · Reinforcement Learning · 日本語</p>
    </div>
    <div class="section-label">active pathways</div>
    <div class="pathway-list" id="pathway-list"></div>
  </div>

  <!-- DETAIL VIEW -->
  <div id="view-detail" class="hidden">
    <div class="detail-header">
      <button class="back-btn" onclick="goHome()">← back</button>
      <div class="detail-title-row">
        <div class="icon-wrap" id="detail-icon"></div>
        <h2 id="detail-title">
          <span id="detail-title-text"></span>
          <span class="completed-stamp hidden" id="detail-stamp">COMPLETED</span>
        </h2>
      </div>
      <div class="detail-progress">
        <div class="bar"><div class="bar-fill" id="detail-bar"></div></div>
        <div class="frac" id="detail-frac"></div>
      </div>
    </div>
    <div class="groups" id="groups-container"></div>
  </div>
</div>

<!-- Date Modal -->
<div class="overlay" id="date-overlay">
  <div class="modal">
    <h3 id="date-modal-title">Start objective</h3>
    <p class="modal-sub">Set a target end date to begin tracking this objective.</p>
    <div class="field">
      <label>Start date</label>
      <div class="static-date" id="date-start-display"></div>
    </div>
    <div class="field">
      <label>Target end date</label>
      <input type="date" id="date-end-input">
    </div>
    <div class="modal-actions">
      <button class="btn cancel" onclick="closeDateModal()">Cancel</button>
      <button class="btn confirm" id="date-confirm-btn" disabled onclick="confirmDateStart()">Confirm</button>
    </div>
  </div>
</div>

<!-- Counter Modal -->
<div class="overlay" id="counter-overlay">
  <div class="modal">
    <h3 id="counter-modal-title">Log session</h3>
    <p class="modal-sub" id="counter-modal-sub">Track how many you've completed.</p>
    <div class="counter-modal-body">
      <div class="round-btn minus" onclick="adjustCounter(-1)">−</div>
      <div class="count-display" id="counter-display">0</div>
      <div class="round-btn plus" onclick="adjustCounter(1)">+</div>
    </div>
    <div class="modal-actions">
      <button class="btn confirm" style="flex:none; width:100%;" onclick="closeCounterModal()">Done</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
